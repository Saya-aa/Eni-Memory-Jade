<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire</title>
    <link rel="stylesheet" href="styleForm.css" />
  </head>
  <body>
    <button>
      <a href="">Retour à l'accueil</a>
    </button>
    <main>
      <div class="display">
        <h2>Formulaire de connexion</h2>
        <label for="signIn">Pas encore de compte ?</label>
        <!--FAIRE LIEN CREER COMPTE-->
        <!--name obligé pour JavaScript-->
        <!--patern: [A-Za-Z] {3,} [demande un alphabet] {demande lettre min}-->
        <button id="signIn" name="signIn">Créer un compte</button>
        <fieldset>
          <legend>Accès à mon compte</legend>
          <form action="" method="get">
            <!--METTRE ACTION-->
            <label for="email">Email :</label>
            <input
              id="email"
              name="email"
              title="Renseigner votre adresse e-mail"
              type="email"
              placeholder="exemple@email.fr"
              required
            />
            <br />
            <label for="mdp">Mot de passe :</label>
            <input
              id="mdp"
              name="mdp"
              title="Renseigner votre mot de passe"
              type="password"
              required
              minlength="8"
            />
            <button type="button" name="buttonMdp">Afficher</button>
            <br />
            <label for="connectON">Rester connecté sur cet appareil</label>
            <input id="connectON" name="connectON" type="checkbox" />
            <br />
            <button>Se connecter</button>
            <button>Mot de passe oublié ?</button>
          </form>
        </fieldset>
        <hr />

        <h2>Formulaire d'inscription</h2>
        <fieldset>
          <legend>Créer votre compte</legend>
          <form action="" method="get">
            <label>Change votre photo de profil :</label>
            <input
              type="file"
              id="photoDP"
              name="photoDP"
              accept=".jpg, .jpeg, .png"
            />
            <br />
            <label for="date">Date de naissance</label>
            <input
              type="date"
              id="date"
              name="date"
              title="Vous devez être majeur pour vous inscrire"
              min="1999-01-01"
              max="2030-01-01"
              value=""
            />
            <br />
            <label for="email">Email* :</label>
            <input
              id="email"
              name="email"
              title="Renseigner votre adresse e-mail"
              type="email"
              placeholder="exemple@email.fr"
              required
            />
            <br />
            <label for="mdp">Mot de passe* :</label>
            <input
              id="mdp"
              name="mdp"
              title="Renseigner votre mot de passe"
              type="password"
              required
              minlength="8"
            />
            <button type="button" name="buttonMdp">Afficher</button>
            <br />
            <button type="submit">Envoyer</button>
          </form>
          <p>* Champ obligatoire</p>
        </fieldset>
    </main>
  </body>
</html>
