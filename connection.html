<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="entete">
    <h1>MEMORY GAME</h1>
    <!--name obligé pour JavaScript-->
    <!--METTRE ACTION-->
    <nav>
      <a href="index.html">Accueil</a>
      <a href="inscription.html">S'inscrire</a>
      <a href="connection.html">Se connecter</a>
      <a href="profil.html">Profil</a>
      <a href="jouer.html">Jouer</a>
    </nav>
    </div>
    <main>
      <div>
        <h2>Connexion</h2>
        <label for="signIn">Pas encore de compte ?</label>
        <button id="signIn" name="signIn" ><a href="inscription.html" class="compte btn-fieldset">Créer un compte</a></button>
        <fieldset class="blackBox">
          <legend>Accès à mon compte</legend>
          <form action="" method="get">
            <!--METTRE ACTION-->
            <label for="email">Email :</label>
            <br />
            <input
              id="email"
              name="email"
              title="Renseigner votre adresse e-mail"
              type="email"
              placeholder="exemple@email.fr"
              required
            />
            <hr class="separator"/>
            <br />
            <label for="mdp">Mot de passe :</label>
            <button type="button" name="buttonMdp" class="btn-fieldset">Afficher</button>
            <br />
            <input
              id="mdp"
              name="mdp"
              title="Renseigner votre mot de passe"
              type="password"
              placeholder="Votre mot de passe"
              required
              minlength="8"
            />
            <hr class="separator"/>
            <label for="connectON">Rester connecté sur cet appareil</label>
            <input id="connectON" name="connectON" type="checkbox" />
            <br />
            <div class="btn">
            <button class="btn-fieldset" >Se connecter</button>
            <button class="btn-fieldset" >Mot de passe oublié ?</button>
            </div>
          </form>
        </fieldset>       
    </main>
  </body>
</html>
