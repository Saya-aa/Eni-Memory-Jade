<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="entete">
      <h1>MEMORY GAME</h1>
      <!--name obligé pour JavaScript-->
      <!--patern: [A-Za-Z] {3,} [demande un alphabet] {demande lettre min}-->
      <!--METTRE ACTION-->
      <nav>
        <a href="index.html">Accueil</a>
        <a href="inscription.html">S'inscrire</a>
        <a href="connection.html">Se connecter</a>
        <a href="profil.html">Profil</a>
        <a href="jouer.html">Jouer</a>
      </nav>
    </div>
    <fieldset class="blackBox">
      <legend>Inscrivez-vous.</legend>
      <form action="" method="get">
        <label for="nameUser">Nom d'utilisateur*</label>
        <br />
        <input
          id="nameUser"
          name="nameUser"
          title="Entrez votre nom d'utilisateur"
          type="text"
          placeholder="3 caractères minimum"
          pattern="^[A-Za-zÀ-ÖØ-öø-ÿ0-9]+${3,}"
          required
        />
        <br />

        <label for="email">Entrez votre email*</label>
        <br />
        <input
          id="email"
          name="email"
          title="Votre adresse e-mail"
          type="email"
          placeholder="exemple@email.fr"
          pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"
          required
        />
        <br />
        <label for="mdp">Mot de passe*</label>
        <br />
        <input
          id="mdp"
          name="mdp"
          title="Renseigner votre mot de passe"
          placeholder="Votre mot de passe"
          type="password"
          required
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{6,}"
        />
        <button type="button" name="buttonMdp">Afficher</button>
        <p>
          Pas d'espace. Au moins un symbole, un chiffre, ainsi que 6 caractères
          minimum.
        </p>
        <label for="mdp">Confirmez votre de passe*</label>
        <br />
        <input
          id="mdp"
          name="mdp"
          title="Confirmez votre mot de passe"
          placeholder="Confirmez votre  mot de passe"
          type="password"
          required
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{6,}"
        />
        <br />
        <button type="submit">Création du compte</button>
        <button type="reset">Annuler</button>
      </form>
      <p>* Champ obligatoire</p>
    </fieldset>
  </body>
</html>
