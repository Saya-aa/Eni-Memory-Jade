<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil</title>
    <link rel="stylesheet" href="style.css" />
    <script src="scriptProfil.js" defer></script>
  </head>
  <body>
    <div class="entete">
      <h1>MEMORY GAME</h1>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="inscription.html">S'inscrire</a>
        <a href="connection.html">Se connecter</a>
        <a href="profil.html">Profil</a>
        <a href="jouer.html">Jouer</a>
      </nav>
    </div>

    <!--Liste information user + boutton modifier ??????-->
    <!--liste partie jouer-->
    <div>
      <fieldset class="blackBox">
        <legend>PROFIL</legend>
        <img src="ressources/question.svg" id="pdp" />
        <label>Modifier votre photo de profil </label>
        <input
          type="file"
          id="photoDP"
          name="photoDP"
          accept=".jpg, .jpeg, .png"
        />
        <br />
        <label for="nameUser">Nom d'utilisateur </label>
        <input
          id="nameUser"
          name="nameUser"
          title="Entrez votre nom d'utilisateur"
          type="text"
          placeholder="3 caractères minimum"
          pattern="^[A-Za-zÀ-ÖØ-öø-ÿ0-9]+${3,}"
          required
        />
        <hr class="separator" />
        <br />
        <label for="email">Email</label>

        <input
          id="email"
          name="email"
          title="Votre adresse e-mail"
          type="email"
          placeholder="exemple@email.fr"
          pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"
          required
        />
        <hr class="separator" />

        <p>Choix du Memory</p>
        <select class="btn-fieldset" id="selectMemory">
          <option value="" selected>--Choisir memory--</option>
          <option value="0">Légumes</option>
          <option value="1">Animaux</option>
          <option value="2">Animaux animés</option>
          <option value="3">Animaux Domestiques</option>
          <option value="4">Chiens</option>
          <option value="5">Dinosaures</option>
          <option value="6">Dinosaures avec nom</option>
          <option value="7">Lettre Scrabble</option>
        </select>
        <img
          id="imgDetail"
          src=""
          alt="detail du thème choisis"
        /><!--img de l'option choisis-->
        <br />
        <p>Taille du Memory</p>
        <select class="btn-fieldset">
          <option value="3">--Choisir taille--</option>
          <option value="0">4*3</option>
          <option value="1">8*6</option>
          <option value="2">16*12</option>
        </select>
        <br />
        <div class="btn">
          <button type="submit" class="btn-fieldset">Enregistrez Option</button>
        </div>
        <h2>Derniers meilleurs scores :</h2>
        <!--TD par partie joué ou jSON ???-->
        <table>
          <tr>
            Pseudo
          </tr>
          <tr>
            Score
          </tr>
          <tr>
            Taille
          </tr>
          <tr>
            Choix Memory
          </tr>
          <tr>
            Date
          </tr>
        </table>
      </fieldset>
    </div>
  </body>
</html>
